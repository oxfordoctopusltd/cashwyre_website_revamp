    <script type="text/javascript">

    <script>
      window.onload = function() {
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;

        if (window.location.pathname.toLowerCase() === "/download") {
          if (/android/i.test(userAgent)) {
            // Redirect to Google Play
            window.location.href = "https://play.google.com/store/apps/details?id=com.vickzil.cashwyre";
          } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
            // Redirect to App Store
            window.location.href = "https://apps.apple.com/tr/app/cashwyre/id6450153762?l=tr";
          } else {
            return window.location.href;
          }
        }
      };
    </script>
